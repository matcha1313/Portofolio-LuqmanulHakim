<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="matchaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121815"/>
      <stop offset="100%" stop-color="#1A241F"/>
    </linearGradient>
    <linearGradient id="matchaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldMatcha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B68D40"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#matchaBg)"/>

  <!-- Top Header Window -->
  <rect width="800" height="40" fill="#0D1310"/>
  <circle cx="22" cy="20" r="5" fill="#EF4444"/>
  <circle cx="40" cy="20" r="5" fill="#F59E0B"/>
  <circle cx="58" cy="20" r="5" fill="#10B981"/>
  <text x="400" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7D988B" text-anchor="middle">OBS Studio — Stream Overlay Package: "matcha late" Channel (1080p 60FPS)</text>

  <!-- Complete Stream Overlay Layout Mockup -->
  <!-- 16:9 Stream Canvas Background -->
  <g transform="translate(60, 65)">
    <rect x="0" y="0" width="680" height="380" rx="14" fill="#0B0F0D" stroke="#25352E" stroke-width="2"/>

    <!-- Gameplay Area Frame with Matcha Neon Border -->
    <rect x="20" y="20" width="480" height="270" rx="8" fill="#151D19" stroke="url(#matchaGreen)" stroke-width="2.5"/>
    <text x="260" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#6EE7B7" opacity="0.4" text-anchor="middle">GAMEPLAY AREA (1920 x 1080)</text>

    <!-- Top Stream Banner Bar -->
    <rect x="20" y="20" width="480" height="32" rx="4" fill="#0D1310" fill-opacity="0.85"/>
    <!-- Logo "matcha late" -->
    <g transform="translate(35, 27)">
      <!-- Cute Matcha Cup Icon -->
      <path d="M 0 0 L 14 0 L 12 14 A 6 6 0 0 1 2 14 Z" fill="url(#matchaGreen)"/>
      <path d="M 14 3 C 18 3 18 10 14 10" fill="none" stroke="#34D399" stroke-width="1.5"/>
      <text x="24" y="12" font-family="'Playfair Display', serif" font-size="13" font-weight="bold" fill="#F4F1EA">matcha late</text>
    </g>
    <!-- Recent Follower & Donation Ticker -->
    <text x="320" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#FCD34D">★ RECENT FOLLOWER: @dika_gaming</text>
    <text x="480" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#34D399" text-anchor="end">♥ TOP DONOR: Rp 250.000</text>

    <!-- Right Side: Streamer Facecam & Live Chat Box -->
    <g transform="translate(515, 20)">
      <!-- Facecam Box with Cute Matcha Border -->
      <rect x="0" y="0" width="145" height="110" rx="10" fill="#131B17" stroke="url(#matchaGreen)" stroke-width="2"/>
      <circle cx="72" cy="48" r="22" fill="#34D399" opacity="0.3"/>
      <path d="M 40 95 C 45 75 55 70 72 70 C 90 70 100 75 105 95 Z" fill="#34D399" opacity="0.3"/>
      
      <!-- Label Nameplate -->
      <rect x="15" y="96" width="115" height="20" rx="10" fill="url(#matchaGreen)"/>
      <text x="72" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#064E3B" text-anchor="middle">@matchalate_live</text>

      <!-- Live Chat Overlay Box -->
      <rect x="0" y="130" width="145" height="160" rx="10" fill="#0D1310" stroke="#25352E" stroke-width="1"/>
      <text x="12" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#34D399">LIVE CHAT</text>
      <text x="12" y="174" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#F4F1EA"><tspan fill="#34D399">Rian:</tspan> GG gameplaynya!</text>
      <text x="12" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#F4F1EA"><tspan fill="#FCD34D">Siti:</tspan> Semangat bang matcha</text>
      <text x="12" y="218" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#F4F1EA"><tspan fill="#60A5FA">Budi:</tspan> Next main bareng yok</text>
      <text x="12" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#F4F1EA"><tspan fill="#F472B6">Ayu:</tspan> Setup overlaynya estetik bgt ✨</text>
    </g>

    <!-- Bottom Alert Box: "New Subscriber Alert" -->
    <g transform="translate(140, 305)">
      <rect x="0" y="0" width="400" height="56" rx="12" fill="#121B16" stroke="url(#goldMatcha)" stroke-width="1.8"/>
      <!-- Alert Icon -->
      <circle cx="36" cy="28" r="16" fill="url(#goldMatcha)"/>
      <text x="36" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="middle">☕</text>
      
      <text x="68" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#FCD34D" letter-spacing="1">NEW SUBSCRIBER JOINED!</text>
      <text x="68" y="44" font-family="'Playfair Display', serif" font-size="15" font-weight="bold" fill="#FFFFFF">Dimas Saputra baru saja berlangganan!</text>
    </g>
  </g>
</svg>
