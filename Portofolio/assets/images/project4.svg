<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p4Bg)"/>

  <!-- Browser Header -->
  <rect width="800" height="40" fill="#292623"/>
  <circle cx="25" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="45" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="65" cy="20" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#C8C3B9" text-anchor="middle">veritas-journal.org/read/modern-aesthetics</text>

  <!-- Editorial Literary Journal Layout -->
  <!-- Classical Monogram Masthead -->
  <g transform="translate(400, 95)" text-anchor="middle">
    <text y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" letter-spacing="4" fill="#B68D40">PUBLIKASI BULANAN • VOL. IV</text>
    <text y="36" font-family="'Playfair Display', serif" font-size="36" font-weight="900" fill="#1C1A17" letter-spacing="2">VERITAS</text>
    <text y="52" font-family="'Playfair Display', serif" font-size="11" font-style="italic" fill="#6B665E">The International Journal of Art, Typography and Philosophy</text>
    <line x1="-320" y1="65" x2="320" y2="65" stroke="#1C1A17" stroke-width="1.5"/>
    <line x1="-320" y1="69" x2="320" y2="69" stroke="#B68D40" stroke-width="0.5"/>
  </g>

  <!-- Two-Column Editorial Spread -->
  <g transform="translate(100, 195)">
    <!-- Column 1 with Drop Cap -->
    <!-- Big 'K' Drop Cap -->
    <rect x="0" y="0" width="55" height="55" fill="#1C1A17"/>
    <text x="27" y="42" font-family="'Playfair Display', serif" font-size="44" font-weight="bold" fill="#D4AF37" text-anchor="middle">K</text>
    
    <g transform="translate(68, 14)">
      <text x="0" y="0" font-family="'Playfair Display', serif" font-size="15" font-weight="bold" fill="#1C1A17">eindahan tipografi klasik</text>
      <text x="0" y="20" font-family="'Playfair Display', serif" font-size="14" fill="#1C1A17">tidak lekang oleh pergantian era.</text>
    </g>

    <text x="0" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#423E39" line-height="1.7">
      Dalam setiap kurva goresan serif, tersimpan sejarah ratusan tahun
    </text>
    <text x="0" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#423E39">
      tentang bagaimana manusia menghormati kata, ritme bacaan,
    </text>
    <text x="0" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#423E39">
      dan kesucian lembaran kertas. Era web modern bukanlah pengganti,
    </text>
    <text x="0" y="146" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#423E39">
      melainkan kanvas baru untuk menyempurnakan warisan abadi tersebut.
    </text>
  </g>

  <g transform="translate(450, 195)">
    <rect x="0" y="0" width="260" height="150" fill="#EAE3D5" stroke="#B68D40" stroke-width="1"/>
    <!-- Engraving style illustration inside column 2 -->
    <circle cx="130" cy="65" r="40" fill="none" stroke="#B68D40" stroke-width="1"/>
    <polygon points="130,30 155,85 105,85" fill="none" stroke="#1C1A17" stroke-width="1.5"/>
    <text x="130" y="125" font-family="'Playfair Display', serif" font-size="10" font-style="italic" fill="#70695F" text-anchor="middle">Fig. 1 — Geometri Rasio Emas (1.618)</text>
    
    <text x="0" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#B68D40">Baca Artikel Lengkap (8 Min Read) →</text>
  </g>
</svg>
