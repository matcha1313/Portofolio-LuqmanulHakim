<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F14"/>
      <stop offset="100%" stop-color="#181A22"/>
    </linearGradient>
    <linearGradient id="neonTk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE"/>
      <stop offset="100%" stop-color="#FE2C55"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#tkBg)"/>

  <!-- Top Bar -->
  <rect width="800" height="40" fill="#13141A"/>
  <circle cx="22" cy="20" r="5" fill="#EF4444"/>
  <circle cx="40" cy="20" r="5" fill="#F59E0B"/>
  <circle cx="58" cy="20" r="5" fill="#10B981"/>
  <text x="400" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7E8496" text-anchor="middle">CapCut Pro & Premiere Pro — Vertical Video Short Pacing (9:16 Format)</text>

  <!-- Left: Vertical Smartphone Mockup (9:16) -->
  <g transform="translate(120, 60)">
    <!-- Phone Outer Case -->
    <rect x="0" y="0" width="220" height="410" rx="28" fill="#0A0B0E" stroke="#2B2F3D" stroke-width="3"/>
    
    <!-- Screen -->
    <rect x="8" y="8" width="204" height="394" rx="22" fill="#12141A"/>
    <!-- Camera Notch -->
    <rect x="75" y="14" width="70" height="14" rx="7" fill="#0A0B0E"/>

    <!-- Dynamic Subtitle (Alex Hormozi / MrBeast Style with Pacing) -->
    <g transform="translate(110, 160)" text-anchor="middle">
      <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#FE2C55"/>
      <text x="0" y="7" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1">MOMEN TERGOKIL!</text>
    </g>

    <g transform="translate(110, 210)" text-anchor="middle">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#FFE500" stroke="#000000" stroke-width="3" paint-order="stroke fill">Jangan Pernah Skip...</text>
    </g>

    <!-- TikTok UI Icons Right -->
    <g transform="translate(175, 190)" fill="#FFFFFF">
      <circle cx="12" cy="12" r="14" fill="#000000" fill-opacity="0.5"/>
      <path d="M 12 8 C 9.5 8 8 10 8 12 C 8 15 12 18 12 18 C 12 18 16 15 16 12 C 16 10 14.5 8 12 8 Z" fill="#FE2C55"/>
      <text x="12" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">142K</text>

      <circle cx="12" cy="62" r="14" fill="#000000" fill-opacity="0.5"/>
      <text x="12" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">1.8K</text>

      <circle cx="12" cy="112" r="14" fill="#000000" fill-opacity="0.5"/>
      <text x="12" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle">9.4K</text>
    </g>

    <!-- Bottom Sound Track Bar -->
    <g transform="translate(20, 355)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#FFFFFF">♫ Trending Streamer Sound - Viral BGM</text>
      <rect x="0" y="8" width="180" height="3" rx="1.5" fill="#2B2F3D"/>
      <rect x="0" y="8" width="120" height="3" rx="1.5" fill="url(#neonTk)"/>
    </g>
  </g>

  <!-- Right: Metrics & Editing Techniques -->
  <g transform="translate(400, 85)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#D4AF37" letter-spacing="3">ALIGHT MOTION & CAPCUT PRO</text>
    <text x="0" y="60" font-family="'Playfair Display', serif" font-size="30" font-weight="bold" fill="#FFFFFF">Optimasi Retensi Audiens</text>
    <text x="0" y="95" font-family="'Playfair Display', serif" font-size="30" font-style="italic" fill="#25F4EE">Shorts & TikTok Pacing</text>

    <text x="0" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#A5ACB8" line-height="1.7">
      Menguasai teknik potongan cepat (jump cut presisi), zoom dinamis,
    </text>
    <text x="0" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#A5ACB8">
      subtitles motion per kata dengan warna penekanan khusus,
    </text>
    <text x="0" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#A5ACB8">
      serta efek suara transisi (whoosh, hit, pop) untuk menjaga engagement.
    </text>

    <!-- Stat Pills -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="150" height="60" rx="10" fill="#171A24" stroke="#2B2F3D" stroke-width="1"/>
      <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7E8496">AVERAGE RETENTION</text>
      <text x="18" y="48" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#10B981">88.5%</text>

      <rect x="165" y="0" width="150" height="60" rx="10" fill="#171A24" stroke="#2B2F3D" stroke-width="1"/>
      <text x="183" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7E8496">ALIGHT MOTION</text>
      <text x="183" y="48" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#D4AF37">Keyframe FX</text>
    </g>
  </g>
</svg>
