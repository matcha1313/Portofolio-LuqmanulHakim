<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kllBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#1E2433"/>
    </linearGradient>
    <linearGradient id="emergencyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="goldKll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#kllBg)"/>

  <!-- Top Header Bar -->
  <rect width="800" height="40" fill="#11141B"/>
  <circle cx="22" cy="20" r="5" fill="#EF4444"/>
  <circle cx="40" cy="20" r="5" fill="#F59E0B"/>
  <circle cx="58" cy="20" r="5" fill="#10B981"/>
  <text x="400" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#8892B0" text-anchor="middle">Branding & Desain Grafis — Info KLL Banjarmasin (Emergency Response)</text>

  <!-- Left: Infografis Tanggap Darurat & Feeds Sosial Media -->
  <g transform="translate(60, 70)">
    <!-- Main Card Container -->
    <rect x="0" y="0" width="340" height="380" rx="16" fill="#181D28" stroke="#2B3245" stroke-width="1.5"/>

    <!-- Emergency Header Banner -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 324 0 C 332.84 0 340 7.16 340 16 L 340 75 L 0 75 Z" fill="url(#emergencyRed)"/>
    <text x="24" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="2">SIAGA TANGGAP DARURAT</text>
    <text x="24" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">INFO KLL BANJARMASIN</text>

    <!-- Emergency Sirene Icon -->
    <g transform="translate(285, 36)">
      <circle cx="0" cy="0" r="18" fill="#FFFFFF" fill-opacity="0.2"/>
      <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
    </g>

    <!-- Content Infografis -->
    <g transform="translate(24, 95)">
      <!-- Map Radar Grid -->
      <rect x="0" y="0" width="292" height="130" rx="10" fill="#10131B" stroke="#2B3245" stroke-width="1"/>
      <circle cx="146" cy="65" r="45" fill="none" stroke="#EF4444" stroke-width="1" stroke-dasharray="3,3"/>
      <circle cx="146" cy="65" r="25" fill="none" stroke="#EF4444" stroke-width="1"/>
      <circle cx="146" cy="65" r="6" fill="#EF4444"/>
      
      <!-- Pin Location -->
      <g transform="translate(180, 50)">
        <polygon points="0,-12 8,-22 -8,-22" fill="#F59E0B"/>
        <circle cx="0" cy="-22" r="8" fill="#F59E0B"/>
        <circle cx="0" cy="-22" r="3" fill="#10131B"/>
      </g>
      <text x="146" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Sektor Pemantauan Wilayah Kota Banjarmasin</text>

      <!-- Key Metrics & Protocol -->
      <g transform="translate(0, 145)">
        <rect x="0" y="0" width="140" height="50" rx="8" fill="#202636"/>
        <text x="14" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">RESPONSE TIME</text>
        <text x="14" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#10B981">&lt; 3 Menit Sigap</text>

        <rect x="152" y="0" width="140" height="50" rx="8" fill="#202636"/>
        <text x="166" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">TIM RELAWAN</text>
        <text x="166" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#F59E0B">Terkoordinasi</text>
      </g>

      <!-- Call to Action Hotline -->
      <g transform="translate(0, 210)">
        <rect x="0" y="0" width="292" height="42" rx="8" fill="url(#goldKll)"/>
        <text x="146" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#10131B" text-anchor="middle">HOTLINE DARURAT 24 JAM RELAWAN</text>
      </g>
    </g>
  </g>

  <!-- Right: Logo & Design System Showcase -->
  <g transform="translate(440, 90)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#D4AF37" letter-spacing="3">IDENTITAS VISUAL & SOSIAL MEDIA</text>
    <text x="0" y="60" font-family="'Playfair Display', serif" font-size="32" font-weight="bold" fill="#FFFFFF">Karakter Visual yang</text>
    <text x="0" y="95" font-family="'Playfair Display', serif" font-size="32" font-style="italic" fill="#EF4444">Jelas & Tanggap Darurat</text>

    <text x="0" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#B2BACE" line-height="1.7">
      Merancang identitas grafis informasi kecelakaan dan kebencanaan
    </text>
    <text x="0" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#B2BACE">
      untuk Info KLL Banjarmasin. Mengutamakan hierarki tipografi
    </text>
    <text x="0" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#B2BACE">
      dengan kontras tinggi agar informasi cepat dipahami masyarakat.
    </text>

    <!-- Role Tags -->
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="130" height="34" rx="17" fill="#202636" stroke="#D4AF37" stroke-width="1"/>
      <text x="65" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#D4AF37" text-anchor="middle">Relawan Emergency</text>

      <rect x="145" y="0" width="155" height="34" rx="17" fill="#202636" stroke="#EF4444" stroke-width="1"/>
      <text x="222" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#EF4444" text-anchor="middle">Desain Tanggap Darurat</text>
    </g>
  </g>
</svg>
