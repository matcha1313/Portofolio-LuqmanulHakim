<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE7DF"/>
      <stop offset="100%" stop-color="#DAD4C8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p3Bg)"/>

  <!-- Minimalist Architectural Wireframe & Render Showcase -->
  <rect width="800" height="40" fill="#2E2C29"/>
  <circle cx="25" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="45" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="65" cy="20" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ABA69D" text-anchor="middle">atelier-architectes.paris/projets</text>

  <!-- Clean Editorial Gallery View -->
  <g transform="translate(60, 80)">
    <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="4" fill="#8A6E3B">PROJET NO. 03</text>
    <text x="0" y="75" font-family="'Playfair Display', serif" font-size="38" font-weight="bold" fill="#1C1A17">Villa Contemporaine</text>
    <text x="0" y="105" font-family="'Playfair Display', serif" font-size="22" font-style="italic" fill="#59544D">Bordeaux, France — 2024</text>
  </g>

  <!-- Architectural Geometry Drawing -->
  <g transform="translate(420, 90)">
    <!-- Base Villa Blocks in Perspective -->
    <polygon points="40,240 280,210 280,310 40,340" fill="#C2BBB0" stroke="#1C1A17" stroke-width="1.5"/>
    <polygon points="280,210 340,160 340,260 280,310" fill="#A8A195" stroke="#1C1A17" stroke-width="1.5"/>
    <polygon points="40,240 100,190 340,160 280,210" fill="#E6E0D5" stroke="#1C1A17" stroke-width="1.5"/>
    
    <!-- Cantilevered Upper Glass Pavilion -->
    <polygon points="10,170 230,140 230,220 10,250" fill="#B68D40" fill-opacity="0.25" stroke="#B68D40" stroke-width="2"/>
    <polygon points="230,140 310,90 310,170 230,220" fill="#B68D40" fill-opacity="0.4" stroke="#B68D40" stroke-width="2"/>
    <polygon points="10,170 90,120 310,90 230,140" fill="#F4F1EA" fill-opacity="0.6" stroke="#B68D40" stroke-width="2"/>

    <!-- Architectural Grid & Dimensions lines -->
    <line x1="-30" y1="360" x2="360" y2="320" stroke="#8A6E3B" stroke-dasharray="3,3"/>
    <line x1="10" y1="50" x2="10" y2="360" stroke="#8A6E3B" stroke-dasharray="2,4" opacity="0.6"/>
    <line x1="310" y1="50" x2="310" y2="360" stroke="#8A6E3B" stroke-dasharray="2,4" opacity="0.6"/>
    <text x="160" y="350" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8A6E3B">AXE PRINCIPAL • 24.80 M</text>
  </g>

  <!-- Caption Left -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="300" height="150" rx="14" fill="#FFFFFF" fill-opacity="0.85" stroke="#D1C7BA" stroke-width="1"/>
    <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#1C1A17">KONSEP ARSITEKTUR BERLANJUTAN</text>
    <text x="24" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#59544D" line-height="1.6">
      Integrasi material batu kapur lokal,
    </text>
    <text x="24" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#59544D">
      ventilasi alami pasif, serta tata cahaya
    </text>
    <text x="24" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#59544D">
      berbingkai proporsi klasik Renaisans.
    </text>
    <text x="24" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#8A6E3B">Lihat Blueprint Lengkap →</text>
  </g>
</svg>
