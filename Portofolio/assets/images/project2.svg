<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1013"/>
      <stop offset="100%" stop-color="#181B20"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p2Bg)"/>
  
  <!-- Window Header -->
  <rect width="800" height="40" fill="#14171C"/>
  <circle cx="25" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="45" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="65" cy="20" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#717682" text-anchor="middle">chronos-suite.io/dashboard/analytics</text>

  <!-- Dashboard Layout -->
  <!-- Sidebar -->
  <rect x="0" y="40" width="180" height="460" fill="#121519" stroke="#22262E" stroke-width="1"/>
  <g transform="translate(25, 70)">
    <circle cx="15" cy="15" r="14" fill="#D4AF37" opacity="0.15" stroke="#D4AF37"/>
    <text x="15" y="20" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" fill="#D4AF37" text-anchor="middle">C</text>
    <text x="40" y="20" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" fill="#FFFFFF">CHRONOS</text>
  </g>
  <!-- Nav items in sidebar -->
  <rect x="15" y="120" width="150" height="34" rx="8" fill="#D4AF37" opacity="0.12"/>
  <text x="35" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#D4AF37">● Portofolio Aktif</text>
  <text x="35" y="182" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#888E99">○ Analitik Pasar</text>
  <text x="35" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#888E99">○ Ekuitas & Obligasi</text>
  <text x="35" y="262" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#888E99">○ Laporan Eksekutif</text>

  <!-- Main Content Area -->
  <!-- Stat Cards -->
  <g transform="translate(210, 65)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="170" height="85" rx="12" fill="#161A20" stroke="#262B34" stroke-width="1"/>
    <text x="16" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#888E99">TOTAL ESTIMASI VALUASI</text>
    <text x="16" y="58" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#FFFFFF">$4,850,200</text>
    <text x="16" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#10B981">+18.4% bulan ini</text>

    <!-- Card 2 -->
    <rect x="185" y="0" width="170" height="85" rx="12" fill="#161A20" stroke="#262B34" stroke-width="1"/>
    <text x="201" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#888E99">INDEX KINERJA TAHUNAN</text>
    <text x="201" y="58" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#D4AF37">94.8 / 100</text>
    <text x="201" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#D4AF37">Performa Optimal</text>

    <!-- Card 3 -->
    <rect x="370" y="0" width="180" height="85" rx="12" fill="#161A20" stroke="#262B34" stroke-width="1"/>
    <text x="386" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#888E99">ALOKASI TINGKAT ASET</text>
    <text x="386" y="58" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#FFFFFF">12 Koleksi Seni</text>
    <text x="386" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#10B981">Terverifikasi Autentik</text>
  </g>

  <!-- Big Interactive Chart Card -->
  <g transform="translate(210, 175)">
    <rect x="0" y="0" width="550" height="280" rx="16" fill="#161A20" stroke="#262B34" stroke-width="1"/>
    <text x="25" y="35" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#FFFFFF">Trayektori Pertumbuhan Aset Real-Time</text>
    <text x="525" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#D4AF37" text-anchor="end">YTD +34.2%</text>

    <!-- Grid lines -->
    <line x1="25" y1="70" x2="525" y2="70" stroke="#262B34" stroke-dasharray="4,4"/>
    <line x1="25" y1="120" x2="525" y2="120" stroke="#262B34" stroke-dasharray="4,4"/>
    <line x1="25" y1="170" x2="525" y2="170" stroke="#262B34" stroke-dasharray="4,4"/>
    <line x1="25" y1="220" x2="525" y2="220" stroke="#262B34"/>

    <!-- Chart Mountain Area -->
    <path d="M 25 220 L 70 190 L 140 170 L 210 185 L 290 130 L 370 145 L 440 95 L 525 80 L 525 220 Z" fill="url(#chartGrad)"/>
    <path d="M 25 220 L 70 190 L 140 170 L 210 185 L 290 130 L 370 145 L 440 95 L 525 80" fill="none" stroke="#D4AF37" stroke-width="3"/>
    
    <!-- Highlight Dot -->
    <circle cx="525" cy="80" r="6" fill="#D4AF37" stroke="#161A20" stroke-width="2"/>
    <circle cx="525" cy="80" r="14" fill="#D4AF37" opacity="0.2"/>

    <!-- Timeline Labels -->
    <text x="30" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#6B7280">JAN</text>
    <text x="140" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#6B7280">APR</text>
    <text x="290" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#6B7280">JUL</text>
    <text x="440" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#6B7280">OKT</text>
    <text x="515" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#D4AF37" font-weight="bold">DES</text>
