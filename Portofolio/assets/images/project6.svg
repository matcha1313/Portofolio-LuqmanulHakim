<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2421"/>
      <stop offset="100%" stop-color="#2D3B36"/>
    </linearGradient>
    <linearGradient id="goldSunset" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p6Bg)"/>

  <!-- Browser Chrome -->
  <rect width="800" height="40" fill="#131B19"/>
  <circle cx="25" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="45" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="65" cy="20" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#7D938C" text-anchor="middle">thegrandheritage-bali.com/villas</text>

  <!-- Luxury Resort Layout -->
  <!-- Architectural Tropical Silhouette -->
  <path d="M 0 500 L 0 320 C 150 310 280 340 400 320 C 520 300 680 340 800 320 L 800 500 Z" fill="#121A17"/>
  <circle cx="400" cy="200" r="90" fill="url(#goldSunset)" opacity="0.35"/>

  <!-- Palm Tree & Villa Silhouette Vectors -->
  <g transform="translate(180, 240)">
    <!-- Villa Pavilion Roof (Balinese Architecture) -->
    <polygon points="120,40 40,80 200,80" fill="#2E3C36" stroke="#D4AF37" stroke-width="1.5"/>
    <polygon points="120,20 60,50 180,50" fill="#1E2824" stroke="#D4AF37" stroke-width="1"/>
    <!-- Pillars -->
    <line x1="60" y1="80" x2="60" y2="150" stroke="#D4AF37" stroke-width="2"/>
    <line x1="180" y1="80" x2="180" y2="150" stroke="#D4AF37" stroke-width="2"/>
    <line x1="120" y1="80" x2="120" y2="150" stroke="#D4AF37" stroke-width="2"/>
  </g>

  <!-- Palm Fronds -->
  <g stroke="#1A2521" stroke-width="4" fill="none">
    <path d="M 620 400 Q 640 280 680 200"/>
    <path d="M 680 200 Q 630 210 590 240"/>
    <path d="M 680 200 Q 730 200 760 230"/>
    <path d="M 680 200 Q 700 230 720 270"/>
    <path d="M 680 200 Q 640 170 610 180"/>
  </g>

  <!-- Hero Typography Overlay -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" letter-spacing="4" fill="#D4AF37">WARISAN KEMEMEWAHAN BALI TROPIS</text>
    <text x="0" y="45" font-family="'Playfair Display', serif" font-size="36" font-weight="bold" fill="#FFFFFF">The Royal Sanctuary</text>
    <text x="0" y="80" font-family="'Playfair Display', serif" font-size="20" font-style="italic" fill="#E2D9C8">Sanur, Bali — Private Pool Estate</text>

    <!-- Booking CTA Bar -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="380" height="52" rx="26" fill="#121A17" fill-opacity="0.9" stroke="#D4AF37" stroke-width="1.2"/>
      <text x="30" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#E2D9C8">Mulai Dari $650 / Malam</text>
      
      <rect x="235" y="6" width="135" height="40" rx="20" fill="#D4AF37"/>
      <text x="302" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#121A17" text-anchor="middle">RESERVASI →</text>
    </g>
  </g>
</svg>
